[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-evaluation-platform"
version = "0.1.0"
description = "Local weighted classification evaluation with sample identity, groups, and reproducible batches"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["mleval*"]

[project.scripts]
mleval = "mleval.cli:main"
